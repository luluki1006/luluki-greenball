<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#6a73e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="花草助手" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>花草养护助手</title>
</head>
<body>
  <div id="app">
    <header class="app-bar">
      <div class="app-bar__title">🌿 花草助手</div>
      <button id="sync-btn" class="app-bar__action" title="刷新天气与提醒">↻</button>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabbar">
      <button class="tab" data-route="home">🏠<span>首页</span></button>
      <button class="tab" data-route="plants">🪴<span>我的植物</span></button>
      <button class="tab tab--add" data-route="add">➕<span>添加</span></button>
      <button class="tab" data-route="calendar">📅<span>养护历</span></button>
      <button class="tab" data-route="settings">⚙️<span>设置</span></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
